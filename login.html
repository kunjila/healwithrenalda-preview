<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Log in — Heal with Renalda</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="mock-banner">Preview login — opens the member app mockup.</div>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="logo-lockup" href="index.html">
        <span class="photo-renalda" style="width:40px;height:40px;border-radius:50%;display:inline-block"></span>
        <span class="logo">Heal with Renalda<span>A mother’s library</span></span>

    </div>
  </header>
  <section class="page-hero">
    <div class="wrap-narrow">
      <h1 style="font-family:Fraunces,serif">Welcome back.</h1>
      <form class="form" style="margin-top:24px" onsubmit="event.preventDefault(); location.href='app.html'">
        <input type="email" placeholder="Email" />
        <input type="password" placeholder="Password" />
        <button class="btn btn-primary" type="submit">Log in</button>
        <p class="fine">No account yet? <a href="join.html">Join the Library</a></p>
      </form>
    </div>
  </section>

</html>
